name: invisible_ai_assistant
description: "Flowdesk — a floating AI assistant overlay for Windows desktop."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # ── Window Management ──────────────────────────────────────────────────────
  window_manager: ^0.5.1          # Frameless, always-on-top, position/size control
  bitsdojo_window: ^0.1.6         # Custom title bar & native Win32 frame removal

  # ── Global Hotkeys & System Tray ───────────────────────────────────────────
  hotkey_manager: ^0.2.3          # System-wide global keyboard shortcuts
  tray_manager: ^0.5.2             # System tray icon, tooltip, context menu

  # ── State Management ──────────────────────────────────────────────────────
  flutter_riverpod: ^3.3.1        # Compile-safe reactive state management

  # ── Persistence ────────────────────────────────────────────────────────────
  shared_preferences: ^2.5.5      # Persist window position, size, preferences

  # ── UI & Design ────────────────────────────────────────────────────────────
  google_fonts: ^8.1.0            # Modern typography (Inter)
  flutter_animate: ^4.5.2         # Declarative micro-animations

  # ── Utilities ──────────────────────────────────────────────────────────────
  uuid: ^4.5.1                    # Unique message IDs
  http: ^1.6.0
  package_info_plus: ^8.3.0
  crypto: ^3.0.6
  flutter_markdown: ^0.7.7+1
  flutter_highlighter: ^0.1.1
  google_generative_ai: ^0.4.7
  markdown: ^7.3.1
  window_protection:
    path: packages/window_protection
  record: 6.2.0
  dio: ^5.9.2
  flutter_secure_storage: ^10.1.0
  url_launcher: ^6.3.2
  auto_updater: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
  windows:
    generate: true
    icon_size: 256
  web:
    generate: true
  image_path: assets/app_icon.png
  min_sdk_android: 21

dependency_overrides:
  record_windows:
    path: .tmp_record_windows
  flutter_secure_storage_windows:
    path: third_party/flutter_secure_storage_windows
  # Marshals WinSparkle callbacks to the Flutter UI thread (fixes platform channel warning/crash).
  auto_updater_windows:
    path: third_party/auto_updater_windows

flutter:
  uses-material-design: true

  assets:
    - assets/
